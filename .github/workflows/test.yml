name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq openssl ripgrep

      - name: Static checks
        run: |
          bash -n install.sh
          bash -n reality.sh
          bash -n install-anytls-reality.sh
          bash -n install-hysteria2-surge.sh
          bash -n tests/test-warp-routing.sh
          shellcheck -S warning install.sh reality.sh install-anytls-reality.sh install-hysteria2-surge.sh tests/test-warp-routing.sh

      - name: Download latest sing-box Alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/SagerNet/sing-box/releases?per_page=30"
          release_json="$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" "$api")"
          version="$(jq -r '
            [.[] | select(.draft == false and .prerelease == true
              and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-alpha\\.[0-9]+$")))
              | .tag_name]
            | .[0] // empty
          ' <<< "$release_json")"
          test -n "$version"
          version_number="${version#v}"
          asset_name="sing-box-${version_number}-linux-amd64.tar.gz"
          digest="$(jq -r --arg name "$asset_name" '
            [.[] | .assets[] | select(.name == $name) | .digest][0] // ""
          ' <<< "$release_json")"
          test -n "$digest"
          curl -fL --retry 3 \
            "https://github.com/SagerNet/sing-box/releases/download/${version}/${asset_name}" \
            -o /tmp/sing-box.tar.gz
          echo "${digest#sha256:}  /tmp/sing-box.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          binary="$(find /tmp -type f -name sing-box -perm -111 | head -n 1)"
          test -n "$binary"
          echo "SING_BOX_TEST_BIN=$binary" >> "$GITHUB_ENV"
          "$binary" version

      - name: Run tests
        run: bash tests/test-warp-routing.sh all
